<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>検索結果</title>
</head>
<body>
    <h1>検索結果</h1>
    <p>検索キーワード: [[${keyword}]]</p>
    <div th:if="${#lists.isEmpty(searchResults)}">
        <p>一致するつぶやきは見つかりませんでした。</p>
    </div>
    <ul th:unless="${#lists.isEmpty(searchResults)}">
        <li th:each="t: ${searchResults}">
            [[${t.comment}]] -- [[${t.name}]] on [[${t.createdAt}]]
        </li>
    </ul>
    <a th:href="@{/read}">メイン画面に戻る</a>
</body>
</html>
