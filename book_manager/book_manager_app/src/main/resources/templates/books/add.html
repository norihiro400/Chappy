<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>書籍追加</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="my-4">新しい書籍を追加</h1>

        <form th:action="@{/books/add}" th:object="${book}" method="post">
            <div class="form-group">
                <label for="title">タイトル:</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label for="author">著者:</label>
                <input type="text" class="form-control" id="author" th:field="*{author}" required>
            </div>
            <div class="form-group">
                <label for="isbn">ISBN:</label>
                <input type="text" class="form-control" id="isbn" th:field="*{isbn}" required>
            </div>
            <button type="submit" class="btn btn-primary">追加</button>
            <a th:href="@{/books}" class="btn btn-secondary">一覧に戻る</a>
        </form>
    </div>
</body>
</html>
